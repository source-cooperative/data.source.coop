compatibility_date = "2026-03-17"
main = "build/worker/shim.mjs"
name = "source-data-proxy"

routes = [
  {pattern = "data.source.coop/*", zone_name = "coolnewgeo.com"},
]

[dev]
# NOTE: Wrangler dev server overrides the host with the first route's host, so we need 
# to set it to the same host as the first route to avoid signature mistmatch issues
# during local development.
host = "localhost:8787"

[build]
command = "cargo install -q worker-build@0.7.5 && worker-build --release"

[vars]
AUTH_AUDIENCE = "fb15e9fb-00e7-4604-9df0-ac27ac5822f2,197e20e7-d52d-4d1d-9e54-4b73a342034b" # prod Ory client_ids: frontend + source-coop-cli
AUTH_ISSUER = "https://auth.source.coop" 
LOG_LEVEL = "WARN" 
# `Cache-Control` for read responses whose backend object sets none. A value the
# object itself carries always wins. Unset -> `no-cache`: storable but
# revalidate-before-reuse, so a re-published object is never served stale (the
# proxy already answers If-None-Match with a 304). Set to "" to send no header.
# DEFAULT_CACHE_CONTROL = "no-cache"
OIDC_PROVIDER_ISSUER = "https://data.source.coop" 
OIDC_PROVIDER_KID = "data-proxy-1" 
# Platform identity providers, each with the audiences its tokens must carry.
# A platform token acts as the account RoleArn names, if that account trusts
# its issuer and subject (ADR-014). GitHub Actions workflows mint their token
# for the proxy's own origin, as source.coop's workflow snippet does.
PLATFORM_ISSUERS = '{"https://token.actions.githubusercontent.com": ["https://data.source.coop"]}'
SOURCE_API_URL = "https://source.coop" 
# Ceiling for client-requested /.sts DurationSeconds (seconds). 43200 = 12h,
# 86400 = 24h. Unset → 3600 (1h). Clients must request DurationSeconds to use
# more than 1h; this only raises the cap.
STS_MAX_SESSION_DURATION_SECS = "43200"

# Required secrets (managed as GitHub environment secrets; CI re-uploads them
# via `wrangler secret bulk` on every deploy — see .github/workflows/deploy.yml):
#   OIDC_PROVIDER_KEY          - PEM-encoded PKCS#8 RSA private key (active)
#   SESSION_TOKEN_KEY          - base64-encoded 32-byte AES key for sealing STS credentials
#   OIDC_PROVIDER_KEY_PREVIOUS - PEM-encoded previous key (optional, for rotation)
#   IP_HASH_SALT               - salt for hashing client IPs in analytics
#                                (optional; unset = unsalted, brute-forceable)
# Optional vars for key rotation:
#   OIDC_PROVIDER_KID_PREVIOUS - Key ID for previous key
# Recommended vars:
# Required vars (to enable /.sts token exchange):
#   AUTH_AUDIENCE - comma-separated OAuth client_id(s) that /.sts subject tokens
#                   must be issued to (the `aud` claim). A token is accepted if
#                   it matches any. Unset = person-token exchange at /.sts is disabled (returns 501).
# Optional vars:
#   PLATFORM_ISSUERS - JSON object from platform issuer URL to the audiences its
#                      tokens must carry. Unset = no platform issuer is trusted.
# Telemetry is billed by GB ingested and stored from 2026-12-01 (#265). The
# ANALYTICS dataset already records every request (status, duration, bytes,
# path), so logs and traces only carry what it can't.
[observability]
enabled = true
head_sampling_rate = 1
# Presigned URLs carry X-Amz-Signature in the query string; traces would
# otherwise store it for their 7-day retention.
redact_query_string = true

[observability.issues]
enabled = true

# Our own WARN/ERROR lines (one per 5xx, see src/lib.rs, plus refused /.sts
# exchanges) are ~30k/day, so keep all of them. Invocation logs were ~99.9% of
# log bytes and duplicate ANALYTICS.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

# ~6 automatic spans per request; at 1% that is still ~330k traced requests/day.
[observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "source_data_proxy_production"

[[services]]
binding = "PUBLIC_LOG_STREAM"
service = "public-log-stream"

# Exchanges at /.sts that may cost a Source API call, per client IP: every API
# key exchange, and each platform-token exchange the trust cache cannot answer.
# It bounds a flood of junk keys, or of platform tokens naming one account after
# another, from one place. A cached trust answer is not charged, so a job
# matrix behind one NAT sharing a subject stays far under it. See src/lib.rs
# `within_rate_limit`.
[[ratelimits]]
name = "STS_EXCHANGE_LIMIT"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[env.staging]
routes = [
  {pattern = "data.staging.coolnewgeo.com/*", zone_name = "coolnewgeo.com"},
  {pattern = "data.staging.source.coop/*", zone_name = "coolnewgeo.com"},
]

[env.staging.vars]
LOG_LEVEL = "DEBUG"
AUTH_AUDIENCE = "1123dfa8-469f-44fe-b9f4-9b76f06fd325,a79c9537-be78-454a-9ea1-b96a1be811cc"  # staging Ory client_ids: frontend + source-coop-cli
AUTH_ISSUER = "https://auth.staging.source.coop"
OIDC_PROVIDER_ISSUER = "https://data.staging.source.coop"
OIDC_PROVIDER_KID = "data-proxy-1"
PLATFORM_ISSUERS = '{"https://token.actions.githubusercontent.com": ["https://data.staging.source.coop"]}'
SOURCE_API_URL = "https://staging.source.coop"
STS_MAX_SESSION_DURATION_SECS = "43200"  # 12h ceiling for client-requested /.sts DurationSeconds

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "source_data_proxy_staging"

[[env.staging.services]]
binding = "PUBLIC_LOG_STREAM"
service = "public-log-stream-staging"

[[env.staging.ratelimits]]
name = "STS_EXCHANGE_LIMIT"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

# Staging is ~2M requests/month, so capturing everything costs ~5 GB/month.
[env.staging.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.staging.observability.issues]
enabled = true

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[env.staging.observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
