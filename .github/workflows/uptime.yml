name: Uptime

# M4 in ADR-015: an outside check that still works when Cloudflare doesn't.
# Alerts only on a change of state: the first failed check opens an `outage`
# issue and posts to Slack; later failures stay quiet while it is open; the
# first passing check closes it and posts the recovery.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: Check data.source.coop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://data.source.coop/
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SLACK_URL: ${{ secrets.ALERTS_SLACK_WEBHOOK_URL }}
    steps:
      - name: Probe, retrying so one dropped request isn't an outage
        id: probe
        run: |
          ok=false
          for attempt in 1 2 3; do
            if curl -fsS --max-time 10 "$URL" | grep -q "Source Cooperative Data Proxy"; then
              ok=true
              break
            fi
            sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Open or close the outage issue
        env:
          OK: ${{ steps.probe.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          notify() {
            [ -n "$SLACK_URL" ] || return 0
            jq -n --arg text "$1" '{text: $text}' | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_URL"
          }
          open=$(gh issue list --label outage --state open --json number -q '.[0].number')
          if [ "$OK" != true ] && [ -z "$open" ]; then
            gh label create outage --color B60205 --description "Opened by the Uptime workflow" --force
            issue=$(gh issue create --label outage --title "data.source.coop is unreachable" \
              --body "Three checks of $URL failed from outside Cloudflare. First failed run: $RUN_URL")
            notify ":rotating_light: data.source.coop is unreachable from outside Cloudflare. $issue"
          elif [ "$OK" = true ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Recovered: $URL answered again. Run: $RUN_URL"
            notify ":white_check_mark: data.source.coop is reachable again. Closed #$open."
          fi
