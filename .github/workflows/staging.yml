name: Staging

on:
  push:
    branches: [main]

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy & Test
    needs: deploy-public-log-stream
    uses: ./.github/workflows/deploy.yml
    with:
      wrangler_env: staging
      environment: staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OIDC_PROVIDER_KEY: ${{ secrets.OIDC_PROVIDER_KEY }}
      SESSION_TOKEN_KEY: ${{ secrets.SESSION_TOKEN_KEY }}
      OIDC_PROVIDER_KEY_PREVIOUS: ${{ secrets.OIDC_PROVIDER_KEY_PREVIOUS }}
      IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}

  deploy-public-log-stream:
    name: Deploy Public Log Stream
    uses: ./.github/workflows/deploy-public-log-stream.yml
    with:
      wrangler_env: staging
      environment: staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  federation-smoke:
    # The only home of real federated e2e (AssumeRoleWithWebIdentity against
    # the deployed worker, which legitimately holds the staging signing key —
    # CI's local worker signs with a throwaway on purpose). Dormant-but-visible
    # until the FEDERATION_TEST_* repo variables point at a federated product:
    # the job shows as skipped, not silently green.
    name: Federation Smoke Test
    needs: deploy
    # All three or nothing: a partial configuration would run the job with
    # every test skipped — green without testing anything.
    if: vars.FEDERATION_TEST_ACCOUNT != '' && vars.FEDERATION_TEST_PRODUCT != '' && vars.FEDERATION_TEST_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run federation smoke tests
        env:
          PROXY_URL: ${{ needs.deploy.outputs.deploy_url }}
          FEDERATION_TEST_ACCOUNT: ${{ vars.FEDERATION_TEST_ACCOUNT }}
          FEDERATION_TEST_PRODUCT: ${{ vars.FEDERATION_TEST_PRODUCT }}
          FEDERATION_TEST_KEY: ${{ vars.FEDERATION_TEST_KEY }}
          FEDERATION_RESTRICTED_PRODUCT: ${{ vars.FEDERATION_RESTRICTED_PRODUCT }}
          FEDERATION_WRITE_PRODUCT: ${{ vars.FEDERATION_WRITE_PRODUCT }}
          # No CI_WRITE_ID_TOKEN is supplied, so the copy-source authz test
          # skips here. Wiring one is a design decision that hasn't been made:
          # this job talks to the *deployed* worker, whose AUTH_ISSUER is Ory,
          # so the token must come from that issuer — and an Ory ID token is
          # short-lived, so it cannot simply be parked in a repo secret. It
          # needs a step that mints one per run from a durable credential
          # (a service-account client_id/secret or refresh token). See the
          # CI_WRITE_ID_TOKEN notes in tests/test_federation.py.
        # boto3: the copy-source authz test signs SigV4 through the AWS SDK
        # rather than hand-rolling requests.
        run: uvx --with requests --with boto3 pytest tests/test_federation.py -v
