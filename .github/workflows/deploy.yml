name: Deploy

on:
  workflow_call:
    inputs:
      worker_name:
        description: "Cloudflare Worker name override (cannot be used with wrangler_env)"
        required: false
        type: string
        default: ""
      wrangler_env:
        description: "Wrangler environment (e.g. staging). Cannot be used with worker_name."
        required: false
        type: string
        default: ""
      wrangler_config:
        description: "Wrangler config file (default: wrangler.toml)"
        required: false
        type: string
        default: "wrangler.toml"
      var_overrides:
        description: "Additional --var flags (e.g. 'LOG_LEVEL:DEBUG SOURCE_API_URL:https://staging.source.coop')"
        required: false
        type: string
        default: ""
      service_overrides:
        description: "Service binding overrides as BINDING:SERVICE pairs (e.g. 'PUBLIC_LOG_STREAM:public-log-stream-pr-1')"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub environment name (preview, staging, production)"
        required: true
        type: string
    outputs:
      deploy_url:
        description: "The deployed worker URL"
        value: ${{ jobs.deploy.outputs.deploy_url }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      OIDC_PROVIDER_KEY:
        required: true
      SESSION_TOKEN_KEY:
        required: true
      OIDC_PROVIDER_KEY_PREVIOUS:
        required: false
      IP_HASH_SALT:
        required: false

jobs:
  # Builds on a runner that holds no secrets. wrangler's `[build]` command runs
  # cargo as a subprocess of the deploy step, so leaving it in place would run
  # the whole Cargo.lock tree — build scripts and proc macros — with
  # CLOUDFLARE_API_TOKEN exported. Mirrors the build job in ci.yml.
  build:
    name: Build Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build@0.7.5
      - run: worker-build --release
      - uses: actions/upload-artifact@v4
        with:
          name: worker-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      deploy_url: ${{ steps.url.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: worker-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/
      # Installed separately so the package resolution is uncredentialed too.
      - run: npm install -g wrangler@3

      - name: Override service bindings
        if: inputs.service_overrides != ''
        run: |
          for pair in ${{ inputs.service_overrides }}; do
            BINDING="${pair%%:*}"
            SERVICE="${pair#*:}"
            # Find the binding line and replace the service on the next line
            sed -i "/binding = \"$BINDING\"/{ n; s/service = \".*\"/service = \"$SERVICE\"/; }" ${{ inputs.wrangler_config }}
          done
          echo "Updated ${{ inputs.wrangler_config }}:"
          cat ${{ inputs.wrangler_config }}

      # Point wrangler at the artifact instead of letting it rebuild. Same
      # rewrite ci.yml uses before `wrangler dev`; [build] stays in the
      # checked-in TOML so local development is unaffected.
      - name: Use prebuilt artifact
        run: |
          CONFIG='${{ inputs.wrangler_config }}'
          grep -q '^\[build\]' "$CONFIG" || { echo "::error::no [build] section in $CONFIG — this rewrite is stale"; exit 1; }
          sed -i '/^\[build\]/,/^\[/ s/^command = .*/command = "echo skip"/' "$CONFIG"
          if grep -q worker-build "$CONFIG"; then
            echo "::error::build command survived the rewrite in $CONFIG"
            exit 1
          fi
          test -f build/worker/shim.mjs || { echo "::error::prebuilt artifact missing at build/worker/shim.mjs"; exit 1; }

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.wrangler_env }}" ]; then
            EXTRA_ARGS="--env ${{ inputs.wrangler_env }}"
          fi
          if [ -n "${{ inputs.worker_name }}" ]; then
            EXTRA_ARGS="--name ${{ inputs.worker_name }}"
          fi
          for var in ${{ inputs.var_overrides }}; do
            EXTRA_ARGS="$EXTRA_ARGS --var $var"
          done
          # Capture the deploy output so the smoke test can target whatever URL
          # wrangler actually published, rather than a hardcoded guess.
          wrangler deploy --config ${{ inputs.wrangler_config }} $EXTRA_ARGS \
            2>&1 | tee deploy.out

      - name: Upload worker secrets
        # GitHub environment secrets are the source of truth — anything set
        # here is re-uploaded on every deploy, overwriting values set manually
        # via `wrangler secret put`. OIDC_PROVIDER_KEY_PREVIOUS and
        # IP_HASH_SALT are included only when the GitHub secret is set
        # (IP_HASH_SALT is optional: the worker falls back to unsalted hashes
        # and warns, so a missing salt must not fail the deploy).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OIDC_PROVIDER_KEY: ${{ secrets.OIDC_PROVIDER_KEY }}
          SESSION_TOKEN_KEY: ${{ secrets.SESSION_TOKEN_KEY }}
          OIDC_PROVIDER_KEY_PREVIOUS: ${{ secrets.OIDC_PROVIDER_KEY_PREVIOUS }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          # Fail loudly if a required secret is missing/empty in this GitHub
          # environment. Without this, jq emits an empty value, `secret bulk`
          # succeeds, the job goes green — and every request to the worker
          # panics in load_config (the worker cannot boot without these).
          [ -n "$OIDC_PROVIDER_KEY" ] || { echo "::error::OIDC_PROVIDER_KEY is not set in the '${{ inputs.environment }}' environment"; exit 1; }
          [ -n "$SESSION_TOKEN_KEY" ] || { echo "::error::SESSION_TOKEN_KEY is not set in the '${{ inputs.environment }}' environment"; exit 1; }
          WORKER_ARGS=""
          if [ -n "${{ inputs.wrangler_env }}" ]; then
            WORKER_ARGS="--env ${{ inputs.wrangler_env }}"
          fi
          if [ -n "${{ inputs.worker_name }}" ]; then
            WORKER_ARGS="--name ${{ inputs.worker_name }}"
          fi
          jq -n '{OIDC_PROVIDER_KEY: env.OIDC_PROVIDER_KEY, SESSION_TOKEN_KEY: env.SESSION_TOKEN_KEY}
                 + (if (env.OIDC_PROVIDER_KEY_PREVIOUS // "") != "" then {OIDC_PROVIDER_KEY_PREVIOUS: env.OIDC_PROVIDER_KEY_PREVIOUS} else {} end)
                 + (if (env.IP_HASH_SALT // "") != "" then {IP_HASH_SALT: env.IP_HASH_SALT} else {} end)' \
            | wrangler secret bulk $WORKER_ARGS

      - name: Get deploy URL
        id: url
        run: |
          # Derive the URL from what wrangler actually published instead of
          # hardcoding it. wrangler lists the deployed triggers after a
          # "Deployed <worker> triggers" line, one per line:
          #   custom routes -> "data.source.coop/* (zone name: ...)"
          #   workers.dev   -> "https://<worker>.<subdomain>.workers.dev"
          # Take the first trigger and normalize it to an https base URL. This
          # works for every environment (preview on workers.dev, staging and
          # production on custom-domain routes) with no per-env configuration.
          TRIGGER="$(sed -n '/Deployed .* triggers/,/Current Version ID/p' deploy.out \
            | grep -oE 'https://[^ ]+|[A-Za-z0-9.-]+\.[A-Za-z]+/\*' \
            | head -n1)"
          if [ -z "$TRIGGER" ]; then
            echo "::error::could not determine deploy URL from wrangler output"
            cat deploy.out
            exit 1
          fi
          URL="${TRIGGER%/\*}"                       # strip a trailing route glob
          case "$URL" in https://*) ;; *) URL="https://$URL" ;; esac
          echo "Resolved deploy URL: $URL"
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        # Confirm the worker actually booted. A missing/malformed secret makes
        # load_config panic on the first request (Cloudflare 1101 → HTTP 5xx),
        # so this turns a silently-broken deploy into a red job.
        run: |
          URL="${{ steps.url.outputs.deploy_url }}"
          echo "Smoke-testing $URL"
          for path in "/" "/.well-known/jwks.json"; do
            ok=""
            # ~90s of budget. A brand-new *.workers.dev hostname — every preview
            # PR creates one — serves 523s until DNS propagates, which Cloudflare
            # documents as taking up to about a minute.
            for attempt in $(seq 1 18); do
              # Report the status rather than swallowing it: a 523 while
              # propagating and a 1101 from a worker that cannot boot are very
              # different failures, and -f alone hides which one happened.
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL$path" || echo "000")
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "ok: $path -> $code"
                ok=1
                break
              fi
              echo "attempt $attempt: $path -> $code, retrying in 5s…"
              sleep 5
            done
            [ -n "$ok" ] || { echo "::error::smoke test failed for $URL$path (last status $code)"; exit 1; }
          done
