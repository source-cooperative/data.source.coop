name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy & Test
    needs: deploy-public-log-stream
    if: github.event.action != 'closed'
    uses: ./.github/workflows/deploy.yml
    with:
      worker_name: source-data-proxy-pr-${{ github.event.pull_request.number }}
      wrangler_config: wrangler.preview.toml
      # All static preview vars live in wrangler.preview.toml [vars]; only the
      # per-PR dynamic bindings are templated here.
      service_overrides: >-
        PUBLIC_LOG_STREAM:public-log-stream-pr-${{ github.event.pull_request.number }}
      environment: preview
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OIDC_PROVIDER_KEY: ${{ secrets.OIDC_PROVIDER_KEY }}
      SESSION_TOKEN_KEY: ${{ secrets.SESSION_TOKEN_KEY }}
      OIDC_PROVIDER_KEY_PREVIOUS: ${{ secrets.OIDC_PROVIDER_KEY_PREVIOUS }}
      IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}

  deploy-public-log-stream:
    name: Deploy Public Log Stream
    if: github.event.action != 'closed'
    uses: ./.github/workflows/deploy-public-log-stream.yml
    with:
      worker_name: public-log-stream-pr-${{ github.event.pull_request.number }}
      wrangler_config: wrangler.preview.toml
      environment: preview
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: PR Comment
    needs: deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Latest commit deployed to

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Latest commit deployed to ${{ needs.deploy.outputs.deploy_url }}

            * Date: `${{ github.event.pull_request.updated_at }}`
            * Commit: ${{ github.sha }}
          edit-mode: replace

  cleanup:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Raw API, not `wrangler delete`: wrangler (seen in 4.162) lists KV
      # namespaces first, which the preview token can't read (10000 auth error).
      # The proxy goes first since it binds the log stream. A 404 means the
      # preview was never deployed, so it's fine.
      - name: Delete preview workers
        run: |
          for name in "source-data-proxy-pr-$PR" "public-log-stream-pr-$PR"; do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true")
            echo "$name: HTTP $code"
            case "$code" in 200|404) ;; *) cat resp.json; exit 1 ;; esac
          done
